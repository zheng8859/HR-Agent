[pytest]
asyncio_mode = auto
# engine fixture 为 session 级，必须与测试共用同一个事件循环，否则 asyncpg 连接池跨 loop 复用损坏
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
pythonpath = .
testpaths = tests
markers =
    l1: L1 单元测试（eval_utils 纯函数，无 DB）
    l2: L2 集成测试（API 端点 + SSE 契约）
    l3: L3 质量评测（agent/dify/rag 三套 Golden）
    slow: 慢速测试（真实 LLM / 大模型，默认跳过）
    suite_agent: Agent 编排测试集（50 样本）
    suite_dify: 内容生成测试集（40 样本）
    suite_rag: 知识问答测试集（30 样本）
