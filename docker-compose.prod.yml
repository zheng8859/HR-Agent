# HR Agent 生产部署编排 —— PostgreSQL(pgvector) + FastAPI 后端 + Nginx 前端
# 前置: cp .env.production.example .env.production 并填真实值
# 首次部署（建表）: docker compose -f docker-compose.prod.yml --env-file .env.production run --rm backend alembic upgrade head
# 启动: docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# 回滚: docker compose -f docker-compose.prod.yml --env-file .env.production down
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: hragent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hragent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-hragent}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # 首次启动自动创建 vector 扩展（幂等）
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-hragent} -d $${POSTGRES_DB:-hragent}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./hragent-backend
    image: hragent-backend:1.0.0
    container_name: hragent-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      SECRET_KEY: ${SECRET_KEY}
      DIFY_BASE_URL: ${DIFY_BASE_URL}
      DIFY_API_KEY: ${DIFY_API_KEY}
      DIFY_TIMEOUT_SECONDS: ${DIFY_TIMEOUT_SECONDS:-60}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-qwen-turbo}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSION: ${EMBEDDING_DIMENSION:-1536}
      RERANK_BASE_URL: ${RERANK_BASE_URL}
      RERANK_API_KEY: ${RERANK_API_KEY}
      RERANK_MODEL: ${RERANK_MODEL:-gte-rerank-v2}
      RAG_MIN_SIMILARITY_SCORE: ${RAG_MIN_SIMILARITY_SCORE:-0.2}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./hragent-frontend
    image: hragent-frontend:1.0.0
    container_name: hragent-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
    name: hragent_pgdata
